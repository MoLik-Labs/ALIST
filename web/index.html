<!DOCTYPE html>
<html lang="en" data-motion>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Kova — unified native storage workspace for local drives, S3, WebDAV, cloud providers, and encrypted vaults.">
<meta name="theme-color" content="#f3f5f7" id="metaThemeColor">
<title>Kova</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none'%3E%3Crect width='32' height='32' rx='8' fill='%230B63CE'/%3E%3Cpath d='M8.5 7.5h4v17h-4z' fill='%23fff'/%3E%3Cpath d='M13.5 15.6 21.2 7.5h3.6l-7.6 8 7.8 9h-3.9z' fill='%23fff'/%3E%3Cpath d='m13.5 15.6 3.7-.1 4-8h-3.6z' fill='%239ECAFF'/%3E%3C/svg%3E">
<style>
/*__INLINE_CSS__*/
</style>
</head>
<body>
<div class="ambient-bg" aria-hidden="true"></div>

<header class="topbar" role="banner">
  <a class="skip-link" href="#mainStage" id="skipLink">Skip to content</a>
  <div class="topbar-left">
    <button type="button" class="btn btn--ghost icon-btn mobile-only" data-act="toggle-sidebar" id="btnMobileNav" aria-label="Open navigation" aria-expanded="false" aria-controls="appSidebar">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5.5h14M3 10h14M3 14.5h14"/></svg>
    </button>
    <button type="button" class="brand" data-act="go-home" aria-label="Kova home">
      <svg class="brand-mark" viewBox="0 0 32 32" width="30" height="30" fill="none" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="#0B63CE"/>
        <path d="M8.5 7.5h4v17h-4z" fill="#fff"/>
        <path d="M13.5 15.6 21.2 7.5h3.6l-7.6 8 7.8 9h-3.9z" fill="#fff"/>
        <path d="m13.5 15.6 3.7-.1 4-8h-3.6z" fill="#9ECAFF"/>
      </svg>
      <span class="brand-name" id="siteTitle">Kova</span>
      <span class="version-pill" id="versionBadge">v4.2</span>
    </button>
  </div>

  <div class="topbar-center">
    <button type="button" class="cmd-trigger" data-act="open-palette" id="cmdTrigger" aria-label="Search files and commands">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="m13.2 13.2 3.8 3.8"/></svg>
      <span class="cmd-trigger-text" id="cmdTriggerLabel">Search files or jump to path...</span>
      <kbd class="kbd-hint" aria-hidden="true">⌘K</kbd>
    </button>
  </div>

  <div class="topbar-right">
    <button type="button" class="btn btn--ghost seg-pill" data-act="toggle-lang" id="btnLang" aria-label="Switch language">EN</button>
    <button type="button" class="btn btn--ghost icon-btn" data-act="toggle-theme" id="btnTheme" aria-label="Switch theme">
      <svg viewBox="0 0 20 20" aria-hidden="true" id="themeIcon"><circle cx="10" cy="10" r="4"/><path d="M10 2.2v2M10 15.8v2M2.2 10h2M15.8 10h2M4.5 4.5l1.4 1.4M14.1 14.1l1.4 1.4M15.5 4.5l-1.4 1.4M5.9 14.1l-1.4 1.4"/></svg>
    </button>
    <button type="button" class="btn btn--ghost desktop-only" data-act="open-admin" id="btnTopAdmin" hidden>
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 5.5h12M4 10h12M4 14.5h12"/><circle cx="7.5" cy="5.5" r="1.7" fill="var(--surface)"/><circle cx="12.5" cy="10" r="1.7" fill="var(--surface)"/><circle cx="8.5" cy="14.5" r="1.7" fill="var(--surface)"/></svg>
      <span id="btnTopAdminLabel">Console</span>
    </button>
    <button type="button" class="btn btn--primary" data-act="auth-action" id="btnAuth">Sign in</button>
  </div>
</header>

<div class="announcement-bar" id="announcementBar" hidden role="status">
  <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.5"/><path d="M10 9.2v4.3M10 6.5h.01"/></svg>
  <span id="announcementText"></span>
  <button type="button" class="btn btn--ghost icon-btn icon-btn--sm" data-act="dismiss-announcement" aria-label="Dismiss notice">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5.5 5.5 9 9M14.5 5.5l-9 9"/></svg>
  </button>
</div>

<div class="sidebar-scrim" id="sidebarScrim" data-act="close-sidebar" hidden></div>

<div class="app-shell" id="appShell">
  <aside class="sidebar" id="appSidebar" aria-label="Workspace navigation">
    <nav class="sidebar-scroll" id="sidebarContent"></nav>
    <div class="sidebar-footer" id="sidebarFooter"></div>
  </aside>

  <main class="main-stage" id="mainStage" tabindex="-1">
    <!-- PUBLIC SHARE VIEW -->
    <section class="view-section" id="shareView" hidden aria-labelledby="shareHeading">
      <div class="stage-header">
        <div class="stage-title-wrap">
          <h1 class="stage-title" id="shareHeading">Shared link</h1>
          <div class="meta-pills" id="shareMetaPills"></div>
        </div>
        <div class="stage-actions" id="shareHeaderActions"></div>
      </div>
      <div class="surface-card" id="shareCard">
        <div class="crumb-bar" id="shareCrumbBar" hidden>
          <nav class="crumbs" id="shareCrumbs" aria-label="Shared folder path"></nav>
          <div class="crumb-tools" id="shareViewTools"></div>
        </div>
        <div id="shareBody"></div>
      </div>
    </section>

    <!-- FILE EXPLORER VIEW -->
    <section class="view-section" id="explorerView" aria-label="File explorer">
      <div class="explorer-bar">
        <nav class="crumbs" id="breadcrumbs" aria-label="Folder path"></nav>
        <div class="explorer-tools">
          <div class="filter-box" id="filterBox">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 5.5h13M6 10h8M8.5 14.5h3"/></svg>
            <input type="search" class="filter-input" id="filterInput" placeholder="Filter folder..." aria-label="Filter current folder" autocomplete="off">
          </div>
          <div class="view-switch" role="group" aria-label="Layout mode">
            <button type="button" class="view-btn is-active" data-act="set-view" data-view="list" id="btnViewList" aria-label="List view" aria-pressed="true">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 5.5h13M3.5 10h13M3.5 14.5h13"/></svg>
            </button>
            <button type="button" class="view-btn" data-act="set-view" data-view="grid" id="btnViewGrid" aria-label="Grid view" aria-pressed="false">
              <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3.2" y="3.2" width="5.6" height="5.6" rx="1.2"/><rect x="11.2" y="3.2" width="5.6" height="5.6" rx="1.2"/><rect x="3.2" y="11.2" width="5.6" height="5.6" rx="1.2"/><rect x="11.2" y="11.2" width="5.6" height="5.6" rx="1.2"/></svg>
            </button>
          </div>
          <button type="button" class="btn btn--ghost icon-btn" data-act="refresh-dir" id="btnRefresh" aria-label="Refresh folder">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16.2 10a6.2 6.2 0 1 1-1.6-4.2M16.2 3.6v3.2H13"/></svg>
          </button>
        </div>
      </div>

      <div class="action-strip" id="writeToolbar" hidden>
        <div class="action-strip-left">
          <button type="button" class="btn btn--primary" data-act="trigger-upload" id="btnUpload">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 13.5V4M6.2 7.6 10 3.8l3.8 3.8M3.5 14.5v1.2a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-1.2"/></svg>
            <span id="lblUpload">Upload</span>
          </button>
          <button type="button" class="btn" data-act="trigger-folder-upload" id="btnUploadFolder">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2.8 5.8a1.5 1.5 0 0 1 1.5-1.5h3.8l1.6 1.8h6a1.5 1.5 0 0 1 1.5 1.5v7.1a1.5 1.5 0 0 1-1.5 1.5H4.3a1.5 1.5 0 0 1-1.5-1.5z"/><path d="M10 13.5V9M8 10.9 10 8.9l2 2"/></svg>
            <span id="lblUploadFolder">Upload folder</span>
          </button>
          <button type="button" class="btn" data-act="new-folder" id="btnMkdir">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2.8 5.8a1.5 1.5 0 0 1 1.5-1.5h3.8l1.6 1.8h6a1.5 1.5 0 0 1 1.5 1.5v7.1a1.5 1.5 0 0 1-1.5 1.5H4.3a1.5 1.5 0 0 1-1.5-1.5z"/><path d="M10 8.7v4.6M7.7 11h4.6"/></svg>
            <span id="lblMkdir">New folder</span>
          </button>
          <button type="button" class="btn" data-act="new-file" id="btnNewFile">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5.2 3.2h6.6l3.4 3.4v10.2H5.2z"/><path d="M11.6 3.2v3.6h3.6M10 9.8v4.2M7.9 11.9h4.2"/></svg>
            <span id="lblNewFile">New file</span>
          </button>
          <button type="button" class="btn" data-act="offline-dl" id="btnOffline">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4.5 13.5a3.5 3.5 0 0 1 .7-6.9 4.8 4.8 0 0 1 9.3 1.2 3.1 3.1 0 0 1 1 6"/><path d="M10 9.5v6.5M7.5 13.6 10 16.1l2.5-2.5"/></svg>
            <span id="lblOffline">Fetch URL</span>
          </button>
        </div>
        <div class="folder-summary" id="folderSummary" aria-live="polite"></div>
      </div>

      <input type="file" id="fileInput" multiple hidden>
      <input type="file" id="folderInput" webkitdirectory directory multiple hidden>

      <div class="surface-card explorer-card" id="explorerDropZone">
        <div class="drop-overlay" id="dropOverlay" hidden aria-hidden="true">
          <div class="drop-overlay-inner">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V5M7.5 9.5 12 5l4.5 4.5M4 17v1.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V17"/></svg>
            <strong id="dropTitle">Drop files or folders to upload</strong>
            <span id="dropSub">Streams directly into the current folder</span>
          </div>
        </div>
        <div id="explorerContent"></div>
      </div>

      <article class="surface-card readme-panel" id="readmeCard" hidden aria-labelledby="readmeHeading">
        <div class="readme-head">
          <div class="readme-title">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4.5 3.5h8l3 3v10h-11z"/><path d="M7.2 9.5h5.6M7.2 12.5h4"/></svg>
            <h2 id="readmeHeading">Folder notes</h2>
          </div>
          <button type="button" class="btn btn--ghost btn--sm" data-act="toggle-readme-mode" id="btnReadmeMode">Raw</button>
        </div>
        <div class="readme-body md-prose" id="readmeBody"></div>
      </article>
    </section>

    <!-- ADMIN CONSOLE VIEW -->
    <section class="view-section" id="adminView" hidden aria-labelledby="adminHeading">
      <div class="stage-header">
        <div class="stage-title-wrap">
          <h1 class="stage-title" id="adminHeading">Admin console</h1>
          <p class="stage-sub" id="adminSub">Manage mounted storages, access control, shares, tasks, and system settings.</p>
        </div>
        <div class="stage-actions">
          <button type="button" class="btn" data-act="close-admin" id="btnBackFiles">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M15.5 10h-11M8.8 5.7 4.5 10l4.3 4.3"/></svg>
            <span id="lblBackFiles">Back to files</span>
          </button>
        </div>
      </div>

      <div class="admin-tabs-wrap">
        <div class="admin-tabs" id="adminTabs" role="tablist" aria-label="Console sections">
          <span class="tab-indicator" id="adminTabIndicator" aria-hidden="true"></span>
          <button type="button" role="tab" class="admin-tab is-active" data-act="admin-tab" data-tab="overview" aria-selected="true" id="tabOverview">Overview</button>
          <button type="button" role="tab" class="admin-tab" data-act="admin-tab" data-tab="storages" aria-selected="false" id="tabStorages">Storages</button>
          <button type="button" role="tab" class="admin-tab" data-act="admin-tab" data-tab="users" aria-selected="false" id="tabUsers">Users</button>
          <button type="button" role="tab" class="admin-tab" data-act="admin-tab" data-tab="roles" aria-selected="false" id="tabRoles">Roles</button>
          <button type="button" role="tab" class="admin-tab" data-act="admin-tab" data-tab="metas" aria-selected="false" id="tabMetas">Path rules</button>
          <button type="button" role="tab" class="admin-tab" data-act="admin-tab" data-tab="shares" aria-selected="false" id="tabShares">Shares</button>
          <button type="button" role="tab" class="admin-tab" data-act="admin-tab" data-tab="tasks" aria-selected="false" id="tabTasks">Tasks</button>
          <button type="button" role="tab" class="admin-tab" data-act="admin-tab" data-tab="settings" aria-selected="false" id="tabSettings">Settings</button>
        </div>
      </div>

      <div class="admin-panel" id="adminPanelBody" role="tabpanel"></div>
    </section>
  </main>
</div>

<!-- FLOATING FROSTED BATCH SELECTION BAR -->
<div class="batch-dock" id="batchDock" hidden role="region" aria-label="Selected items actions">
  <span class="batch-count" id="batchCount">0 selected</span>
  <div class="batch-actions">
    <button type="button" class="btn btn--ghost btn--sm" data-act="select-all" id="btnBatchAll">Select all</button>
    <button type="button" class="btn btn--sm" data-act="batch-copy" id="btnBatchCopy">Copy to</button>
    <button type="button" class="btn btn--sm" data-act="batch-move" id="btnBatchMove">Move to</button>
    <button type="button" class="btn btn--danger btn--sm" data-act="batch-delete" id="btnBatchDelete">Delete</button>
    <button type="button" class="btn btn--ghost icon-btn icon-btn--sm" data-act="clear-selection" id="btnBatchClear" aria-label="Clear selection">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5.5 5.5 9 9M14.5 5.5l-9 9"/></svg>
    </button>
  </div>
</div>

<!-- FLOATING FROSTED UPLOAD QUEUE DOCK -->
<aside class="upload-dock" id="uploadDock" hidden aria-label="Upload progress">
  <div class="upload-dock-head">
    <div class="upload-dock-title">
      <span class="status-dot is-live" id="uploadDot"></span>
      <strong id="uploadSummaryTitle">Uploading...</strong>
    </div>
    <div class="upload-dock-btns">
      <button type="button" class="btn btn--ghost btn--sm" data-act="cancel-upload" id="btnUploadCancel">Cancel</button>
      <button type="button" class="btn btn--ghost icon-btn icon-btn--sm" data-act="close-upload-dock" id="btnUploadClose" hidden aria-label="Close uploads">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5.5 5.5 9 9M14.5 5.5l-9 9"/></svg>
      </button>
    </div>
  </div>
  <div class="upload-meta" id="uploadMeta"></div>
  <div class="progress-track"><div class="progress-fill" id="uploadProgressBar"></div></div>
  <div class="upload-queue-list" id="uploadQueueList"></div>
</aside>

<!-- FROSTED CONTEXT MENU -->
<div class="ctx-menu" id="ctxMenu" role="menu" hidden></div>

<!-- FROSTED COMMAND PALETTE & FTS5 SEARCH -->
<div class="overlay" id="paletteOverlay" data-act="palette-backdrop" hidden>
  <div class="palette-dialog" role="dialog" aria-modal="true" aria-labelledby="paletteInputLabel">
    <label class="sr-only" for="paletteInput" id="paletteInputLabel">Search files and workspace actions</label>
    <div class="palette-head">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="m13.2 13.2 3.8 3.8"/></svg>
      <input type="search" class="palette-input" id="paletteInput" placeholder="Search files or run an action..." autocomplete="off" spellcheck="false">
      <button type="button" class="kbd-btn" data-act="close-palette" aria-label="Close search">Esc</button>
    </div>
    <div class="palette-scopes" id="paletteScopes">
      <button type="button" class="scope-chip is-active" data-act="palette-scope" data-scope="0" id="scopeAll">All</button>
      <button type="button" class="scope-chip" data-act="palette-scope" data-scope="1" id="scopeDirs">Folders</button>
      <button type="button" class="scope-chip" data-act="palette-scope" data-scope="2" id="scopeFiles">Files</button>
      <label class="scope-global">
        <input type="checkbox" id="paletteGlobal" checked>
        <span id="scopeGlobalLabel">Everywhere</span>
      </label>
    </div>
    <div class="palette-results" id="paletteResults" role="listbox"></div>
    <div class="palette-foot" id="paletteFoot">
      <span><kbd>↑↓</kbd> navigate</span>
      <span><kbd>↵</kbd> open</span>
      <span><kbd>Esc</kbd> close</span>
    </div>
  </div>
</div>

<!-- FROSTED MODAL DIALOG -->
<div class="overlay" id="modalOverlay" data-act="modal-backdrop" hidden>
  <div class="modal-dialog" id="modalDialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div id="modalContent"></div>
  </div>
</div>

<!-- FROSTED TOAST -->
<div class="toast-stack" id="toastStack" aria-live="polite" aria-atomic="true"></div>

<script>
/*__INLINE_JS__*/
</script>
</body>
</html>

# Render Blueprint for the standalone Kova service.
# Keep the persistent disk mounted at /opt/alist/data: it contains SQLite data,
# the signing key, account records, and storage configuration.
services:
  - type: web
    name: kova
    runtime: docker
    autoDeployTrigger: off
    plan: starter
    region: singapore
    healthCheckPath: /ping
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PUID
        value: "10001"
      - key: PGID
        value: "10001"
      - key: UMASK
        value: "027"
      - key: TZ
        value: UTC
    disk:
      name: kova-data
      mountPath: /opt/alist/data
      sizeGB: 1

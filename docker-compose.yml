services:
  alist:
    build: .
    container_name: alist-nggkhaiz
    restart: unless-stopped
    init: true
    ports:
      - "${ALIST_PORT:-5244}:5244"
    environment:
      PUID: ${PUID:-10001}
      PGID: ${PGID:-10001}
      UMASK: ${UMASK:-027}
      TZ: ${TZ:-UTC}
      ALIST_TRUST_PROXY: ${ALIST_TRUST_PROXY:-false}
    volumes:
      - ./data:/opt/alist/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5244/ping"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    stop_grace_period: 30s

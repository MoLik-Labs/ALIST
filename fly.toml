# Single-machine native Kova deployment. `fly launch --no-deploy` adds an
# app name and region. Do not scale out: SQLite and Fly volumes are local.
[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "5244"

[deploy]
  strategy = "immediate"

[mounts]
  source = "kova_data"
  destination = "/opt/alist/data"

[http_service]
  internal_port = 5244
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/ping"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1024mb"

name: Isolated upstream Go build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["BETA", "main", "CLOUDFLARE"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-go-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  upstream-build:
    name: Verify baseline and compile upstream Go
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify imported baseline
        run: python3 scripts/check_upstream_alist.py
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: upstream/alist/go.sum
      - name: Compile isolated upstream server
        working-directory: upstream/alist
        run: go build -trimpath -o "$RUNNER_TEMP/upstream-alist" .
      - name: Smoke-test command help
        run: '"$RUNNER_TEMP/upstream-alist" --help'
